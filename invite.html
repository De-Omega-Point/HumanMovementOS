<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Movement OS · Client Invite · De-Omega-Point</title><link rel="stylesheet" href="trainer.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-adapter.js"></script><meta name="application-name" content="Human Movement OS"><meta name="author" content="De-Omega-Point"><meta property="og:site_name" content="De-Omega-Point"><meta property="og:type" content="website"></head><body><main class="shell" style="max-width:760px"><section class="card section" style="margin-top:8vh"><div class="brand"><div class="mark">Ω</div><div><b>Human Movement OS</b><small>Trainer invitation</small></div></div><h1>Join your training account</h1><p>Sign in using the same email address that received this invitation. Your programme is connected only after the invite is securely claimed.</p><div id="signin"><label>Email<input class="field" id="email" type="email" autocomplete="email"></label><button class="btn primary" id="send">Send secure sign-in link</button></div><div id="claim" hidden><p>Signed in as <b id="who"></b></p><button class="btn primary" id="claimbtn">Connect my trainer</button></div><p class="notice" id="msg" hidden></p></section><footer class="dop-footer"><span><b>De-Omega-Point</b> · Human Movement OS</span><span>Human Value Centric · <a href="https://de-omega-point.com/" target="_blank" rel="noopener">de-omega-point.com</a></span></footer></main><script>
(async()=>{const $=s=>document.querySelector(s),p=new URLSearchParams(location.search),token=p.get('token'),msg=t=>{const e=$('#msg');e.hidden=false;e.textContent=t};if(!token)return msg('This invitation link is incomplete. Ask your trainer for a new invite.');if(HMOBackend.mode!=='supabase')return msg('Live invitations require Supabase mode.');const sess=await HMOBackend.session();if(sess){$('#signin').hidden=true;$('#claim').hidden=false;$('#who').textContent=sess.user.email;}$('#send').onclick=async()=>{const email=$('#email').value.trim();if(!email)return msg('Enter the invited email address.');try{await HMOBackend.signIn(email,location.href);msg('Check your email, then return through the secure link.');}catch(e){msg(e.message)}};$('#claimbtn').onclick=async()=>{try{await HMOBackend.claimInvite(token);msg('Connected. Opening your programme…');setTimeout(()=>location.href='onboarding.html',500)}catch(e){const map={email_mismatch:'Use the exact email address your trainer invited.',invite_expired:'This invite has expired. Ask your trainer for a new one.',invalid_invite:'This invitation is invalid.'};msg(map[e.message]||e.message)}}})();
</script></body></html>
