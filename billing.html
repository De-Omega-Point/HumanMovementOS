<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110D"><title>Billing · Human Movement OS · De-Omega-Point</title><link rel="stylesheet" href="trainer.css"><style>.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.price{font-size:32px;font-weight:800}.billingstatus{padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:14px}@media(max-width:760px){.plans{grid-template-columns:1fr}}</style><meta name="application-name" content="Human Movement OS"><meta name="author" content="De-Omega-Point"><link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest"></head><body><main style="max-width:980px;margin:auto;padding:24px"><div class="brandbar"><img src="assets/brand/logo-512.png" alt="De-Omega-Point official logo"><div><b>Human Movement OS</b><small>by De-Omega-Point · Secure Stripe billing</small></div></div><div class="top"><div><h1>Membership & billing</h1><p>Human Movement OS · secure Stripe billing</p></div><a class="btn" href="onboarding.html">Back to onboarding</a></div><div id="billing-root"></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-adapter.js"></script><script>
(async()=>{const root=document.querySelector('#billing-root'),money=(c,cur='aud')=>new Intl.NumberFormat('en-AU',{style:'currency',currency:cur.toUpperCase()}).format(c/100),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
if(HMOBackend.mode!=='supabase'){root.innerHTML=`<section class="card section"><h2>Demo billing</h2><p class="notice">Live checkout is intentionally disabled until Stripe + Supabase secrets are configured.</p><div class="plans">${[['Coaching',14900],['Coaching Plus',24900],['Premium',39900]].map(([n,a])=>`<article class="card section"><h3>${n}</h3><div class="price">${money(a)}</div><small>per month</small><p><button class="btn primary" disabled>Checkout unavailable in demo</button></p></article>`).join('')}</div></section>`;return;}
const s=await HMOBackend.session(),me=await HMOBackend.me();if(!s){location.replace('account.html?next=billing.html');return}if(me?.role!=='client'){location.replace(me?.role==='administrator'?'administrator.html':'trainer.html');return}
const [plans,sub,pays]=await Promise.all([HMOBackend.billingPlans(),HMOBackend.mySubscription(),HMOBackend.myPayments()]);root.innerHTML=`<section class="card section"><h2>Your subscription</h2>${sub?`<div class="billingstatus"><b>${esc(sub.plan?.name||'Subscription')}</b><p>Status: <strong>${esc(sub.status)}</strong>${sub.cancel_at_period_end?' · Cancels at period end':''}</p><p>${sub.current_period_end?'Current period ends '+new Date(sub.current_period_end).toLocaleDateString('en-AU'):''}</p><button class="btn" id="portal">Manage payment method / subscription</button></div>`:'<p>No active subscription is recorded.</p>'}</section><section class="card section" style="margin-top:16px"><h2>Plans</h2><div class="plans">${plans.map(p=>`<article class="card section"><h3>${esc(p.name)}</h3><div class="price">${money(p.amount_cents,p.currency)}</div><small>per ${esc(p.interval)}</small><p>${esc(p.description||'')}</p>${p.trial_days?`<p>${p.trial_days}-day trial</p>`:''}<button class="btn primary buy" data-plan="${p.id}">Choose plan</button></article>`).join('')||'<p>No plans are active yet.</p>'}</div></section><section class="card section" style="margin-top:16px"><h2>Payment history</h2>${pays.length?pays.map(p=>`<p><b>${money(p.amount_paid_cents,p.currency)}</b> · ${esc(p.status)} · ${p.paid_at?new Date(p.paid_at).toLocaleDateString('en-AU'):'—'}${p.refunded_cents?' · refunded '+money(p.refunded_cents,p.currency):''}</p>`).join(''):'<p>No payments yet.</p>'}</section>`;
document.querySelectorAll('.buy').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='Opening secure checkout…';try{const x=await HMOBackend.createCheckout(b.dataset.plan);if(x?.url)location.href=x.url;else throw new Error(x?.error||'Checkout unavailable')}catch(e){alert(e.message);b.disabled=false;b.textContent='Choose plan'}});const portal=document.querySelector('#portal');if(portal)portal.onclick=async()=>{portal.disabled=true;try{const x=await HMOBackend.createBillingPortal();if(x?.url)location.href=x.url;else throw new Error(x?.error||'Portal unavailable')}catch(e){alert(e.message);portal.disabled=false}};
})();
</script></body></html>
