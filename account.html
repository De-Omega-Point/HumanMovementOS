<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Movement OS · Account</title><link rel="stylesheet" href="trainer.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-adapter.js"></script></head><body><main class="shell" style="max-width:760px"><section class="card section" style="margin-top:8vh"><div class="brand"><div class="mark">Ω</div><div><b>Human Movement OS</b><small>Secure account</small></div></div><h1 id="title">Sign in</h1><p id="lead">Use the email address your trainer invited.</p><div id="authbox"><label>Email<input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><button class="btn primary" id="send">Send secure sign-in link</button></div><div id="signed" hidden><p>Signed in as <b id="who"></b></p><div class="actions"><a class="btn primary" id="continue" href="index.html">Open workout</a><a class="btn" id="billing" href="billing.html">Billing</a><button class="btn" id="out">Sign out</button></div></div><p class="notice" id="msg" hidden></p></section></main><script>
(async()=>{const $=s=>document.querySelector(s),msg=t=>{const e=$('#msg');e.hidden=false;e.textContent=t};if(HMOBackend.mode!=='supabase')return msg('This package is still in demo mode. Add your Supabase project details to config.js to enable live accounts.');const next=new URLSearchParams(location.search).get('next')||'index.html';const s=await HMOBackend.session();if(s){const me=await HMOBackend.me();$('#authbox').hidden=true;$('#signed').hidden=false;$('#who').textContent=me?.display_name||s.user.email;if(me?.role==='client'){const ob=await HMOBackend.myOnboarding();$('#continue').href=ob?.status==='approved'?next:'onboarding.html';$('#continue').textContent=ob?.status==='approved'?'Open workout':'Continue onboarding';}else{$('#continue').href=me?.role==='administrator'?'administrator.html':'trainer.html';}$('#billing').hidden=me?.role!=='client';}$('#send').onclick=async()=>{const email=$('#email').value.trim();if(!email)return msg('Enter your email address.');try{await HMOBackend.signIn(email,new URL(location.href).href);msg('Check your email for the secure sign-in link.');}catch(e){msg(e.message)}};$('#out').onclick=async()=>{await HMOBackend.signOut();location.reload()};})();
</script></body></html>
